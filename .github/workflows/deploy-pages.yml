name: Deploy Shopfront to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          mkdir public
          cp index.html public/
          cp style.css public/
          cp app.js public/

          CLEAN_CARTO_KEY="$(printf '%s' "$CARTO_API_KEY" | tr -d '\r\n')"

          printf 'window.SHOPFRONT_CONFIG = { CARTO_API_KEY: "%s" };\n' "$CLEAN_CARTO_KEY" > public/config.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4